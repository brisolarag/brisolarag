name: Update README stats

on:
  schedule:
    # Cron is UTC-only. Brasília is UTC-3 year-round (no DST since 2019).
    - cron: "30 11 * * *"  # 08:30 Brasília
    - cron: "0 15 * * *"   # 12:00 Brasília
    - cron: "0 18 * * *"   # 15:00 Brasília
    - cron: "0 21 * * *"   # 18:00 Brasília
  workflow_dispatch:        # allows manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_USERNAME: brisolarag
        run: python scripts/update_readme.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update README stats [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}